# ═══════════════════════════════════════════════════════════════
#  Configuración del proyecto (se sube a GitHub, SIN credenciales reales)
#
#  Para tus datos personales (URL real, usuario, contraseña) copia
#  config.local.properties.example como config.local.properties:
#  ese archivo NO se sube a GitHub y tiene prioridad sobre este.
#
#  También puedes sobrescribir cualquier valor al ejecutar:
#    mvn test -Dbrowser=firefox -Dheadless=true
# ═══════════════════════════════════════════════════════════════

# Nombre que aparece en los reportes
project.name=Proyecto de Automatización

# Ambiente: local | dev | qa | staging | prod
test.env=local

# URL a probar. Vacía = se usa el sitio de la carpeta WebSite/ en http://localhost:3000
base.url=
web.port=3000

# Navegador: chrome | firefox | edge
browser=chrome
# true = sin ventana (siempre es true en GitHub Actions)
headless=false

# Espera máxima (segundos) para encontrar elementos
timeout.seconds=10

# Quién ejecuta (vacío = usuario de Windows)
executor=

# Reportes
report.pdf=true
# all = captura en cada paso | failed = solo en pasos fallidos
report.screenshots=all
# true = abre reports/index.html al terminar
report.open=true

# Dominios que NO se cargan (anuncios que tapan botones), separados por coma. Solo Chrome y Edge.
# Ej: googlesyndication.com, doubleclick.net, googleadservices.com, fundingchoicesmessages.google.com
blocked.hosts=

# Credenciales del sitio de ejemplo (WebSite/)
user=admin
password=Admin123
