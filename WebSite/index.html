<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Bank · Iniciar sesión</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="brand"><span class="brand-mark">D</span> Demo Bank</div>
    <h1>Iniciar sesión</h1>
    <p class="hint">Sitio de práctica. Usuario <b>admin</b> · Contraseña <b>Admin123</b></p>

    <form id="login-form" novalidate>
      <label for="username">Usuario</label>
      <input id="username" name="username" autocomplete="username">

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password">

      <div id="error" class="alert" role="alert" hidden></div>

      <button type="submit">Ingresar</button>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
